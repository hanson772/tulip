services:
  app:
    build: .
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:-tulip_jwt_secret_key_change_in_production}
      # Uncomment to auto-create admin on first startup:
      # - ad_email=admin@xxx.com
      # - ad_email=1111
      # - ad_name=Admin
    volumes:
      - tulip-data:/app/data
    restart: unless-stopped

volumes:
  tulip-data:
