services:
  app:
    build: .
    ports:
      - "${PORT:-80}:80"
    environment:
      - PORT=80
      - JWT_SECRET=${JWT_SECRET:-tulip_jwt_secret_key_change_in_production}
      # Uncomment to auto-create admin on first startup:
      #- ad_email=admin@test.com
      #- ad_pwd=123456
      #- ad_name=Admin
    volumes:
      - /Users/chenhaidi/Documents/workspace/docker/data/tulip:/app/data
    restart: unless-stopped
